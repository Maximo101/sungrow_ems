blueprint:
  name: "Sungrow EMS: battery SoC alert"
  description: >-
    Sends a notification when the battery state of charge goes below or above
    a level and stays there. Create one automation per level (for example
    full, 30 %, 5 %). Works with any battery SoC sensor.
  domain: automation
  author: Maximo101
  source_url: https://github.com/Maximo101/sungrow_ems/blob/main/blueprints/automation/sungrow_ems/battery_soc_alert.yaml
  homeassistant:
    min_version: 2024.10.0
  input:
    soc_sensor:
      name: Battery SoC sensor
      description: For Sungrow EMS, pick "Battery SoC" on the inverter device.
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: battery
    direction:
      name: Alert when the SoC is
      default: below
      selector:
        select:
          options:
            - label: Below the level
              value: below
            - label: Above the level
              value: above
    level:
      name: Level
      default: 30
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider
    hold:
      name: Must stay there for
      description: Stops a brief dip or peak from sending an alert.
      default:
        minutes: 2
      selector:
        duration:
    cooldown:
      name: Quiet time between alerts
      description: After an alert, no further alert is sent for this many hours. 0 turns this off.
      default: 2
      selector:
        number:
          min: 0
          max: 24
          step: 0.5
          unit_of_measurement: h
          mode: box
    notify_action:
      name: Notify action
      description: The notify action to call, for example notify.mobile_app_my_phone.
      default: notify.notify
      selector:
        text:
    title:
      name: Notification title
      default: Home battery
      selector:
        text:
    message:
      name: Notification message
      description: "You can use {{ soc }} (current SoC) and {{ level }}."
      default: "Battery is at {{ soc }} %."
      selector:
        text:
          multiline: true
    extra_actions:
      name: Extra actions (optional)
      description: Run after the notification, for example turn a switch off.
      default: []
      selector:
        action:

mode: single
max_exceeded: silent

trigger_variables:
  soc_entity: !input soc_sensor
  direction: !input direction
  level: !input level

variables:
  cooldown: !input cooldown
  soc: "{{ states(soc_entity) | float(0) | round(0) | int }}"

triggers:
  - trigger: template
    value_template: >-
      {% set value = states(soc_entity) | float(none) %}
      {{ value is not none and
         ((direction == 'below' and value < level) or
          (direction == 'above' and value > level)) }}
    for: !input hold

conditions:
  - condition: template
    value_template: >-
      {{ cooldown | float(0) == 0
         or this.attributes.last_triggered is none
         or (now() - this.attributes.last_triggered) > timedelta(hours=cooldown | float(0)) }}

actions:
  - action: !input notify_action
    data:
      title: !input title
      message: !input message
  - sequence: !input extra_actions
